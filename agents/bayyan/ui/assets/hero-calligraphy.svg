<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Bayyan calligraphy artwork">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c3a2b"/>
      <stop offset="0.55" stop-color="#08291f"/>
      <stop offset="1" stop-color="#051b14"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8893f"/>
      <stop offset="0.5" stop-color="#f0d9a5"/>
      <stop offset="1" stop-color="#b8893f"/>
    </linearGradient>
    <pattern id="arabesque" width="80" height="80" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="80" height="80" fill="none"/>
      <path d="M40 0 L80 40 L40 80 L0 40 Z" fill="none" stroke="#d9b46a" stroke-opacity="0.16" stroke-width="1.5"/>
      <circle cx="40" cy="40" r="9" fill="none" stroke="#d9b46a" stroke-opacity="0.12" stroke-width="1"/>
      <circle cx="40" cy="40" r="2" fill="#d9b46a" fill-opacity="0.18"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="460" fill="url(#bg)"/>
  <rect width="1200" height="460" fill="url(#arabesque)"/>
  <ellipse cx="600" cy="215" rx="360" ry="180" fill="url(#glow)"/>

  <rect x="26" y="26" width="1148" height="408" rx="10" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <rect x="38" y="38" width="1124" height="384" rx="6" fill="none" stroke="#d9b46a" stroke-opacity="0.35" stroke-width="1"/>
  <path d="M26 80 h40 M1134 80 h40 M26 380 h40 M1134 380 h40" stroke="#d9b46a" stroke-width="2"/>

  <g fill="#d9b46a" fill-opacity="0.8">
    <circle cx="600" cy="62" r="4"/><circle cx="600" cy="398" r="4"/>
    <circle cx="62" cy="230" r="4"/><circle cx="1138" cy="230" r="4"/>
  </g>

  <text x="600" y="252" text-anchor="middle" font-family="'Noto Nastaliq Urdu','Amiri',serif" font-size="132" fill="url(#gold)">بیان</text>
  <text x="600" y="330" text-anchor="middle" font-family="'Cormorant Garamond',Georgia,serif" font-size="22" letter-spacing="9" fill="#f0d9a5" fill-opacity="0.78">POETRY, UNDERSTOOD</text>
</svg>
